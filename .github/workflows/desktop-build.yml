name: desktop

# 桌面端（Tauri）构建。
#
# 定位：**验证阶段不进公开 Release**。
# 所有产物只上传为 Actions Artifacts（需登录、14 天过期），
# 由维护者下载实测、确认可用之后再决定是否并入 main 并发布。
# 这正是 feat/desktop-tauri 分支存在的方式 —— 先在分支上验证，跑通了再合并。
#
# 触发：
#   · push 到 feat/desktop-tauri 等桌面分支 → 自动构建，产出 Artifacts
#   · workflow_dispatch（手动）→ 可指定是否构建 macOS
#   · 合并进 main 之后也不会自动发布，仍需要手动 dispatch
on:
  push:
    branches:
      - feat/desktop-tauri
      - feat/desktop-*
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'version.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/**'
  workflow_dispatch:
    inputs:
      build_macos:
        description: '同时构建 macOS（需要 Apple runner 额度）'
        type: boolean
        default: true

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 不把调试符号带进产物，省一半体积
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # ------------------------------------------------------------------
  # 第 1 关：Rust 单元测试
  #
  # 这一关是桌面端正确性的**主闸门**。weapi 加密只要错一个字节，
  # 网易云就只回 {"code":400}，界面上完全看不出是填充错了还是 base64 不同。
  # 所以 weapi.rs 里带了一组固定向量测试，必须在三个平台都跑通。
  # ------------------------------------------------------------------
  test:
    name: Rust 单元测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Linux 上 Tauri 需要这些系统库才能编译（webkit2gtk 是 WebView 本体）
      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # 只测 weapi / netease 这两个纯逻辑模块：
      # 它们不依赖 webview，能在任何平台上跑，是「加密对不对」的核心。
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --lib --verbose

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # 第 2 关：前端组装 + 语法检查
  #
  # 桌面端复用 app/ 那 13000 行前端，但要先跑一遍组装脚本注入桥接层。
  # 这一步同时验证「注入锚点还在」—— 如果前端结构改了导致注入失败，
  # 这里会立刻红，而不是等到打包出一个点不开的 exe。
  # ------------------------------------------------------------------
  frontend:
    name: 前端组装与检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 组装桌面端前端包
        run: bash desktop/build-frontend.sh

      - name: 校验桥接层已注入
        run: |
          fail=0
          # 1. bridge.js 必须在 dist 里
          test -f desktop/dist/bridge.js || { echo "::error::desktop/dist/bridge.js 缺失"; fail=1; }
          # 2. index.html 必须引用了它，且位置在 version.js 之前
          grep -q 'src="bridge.js"' desktop/dist/index.html \
            || { echo "::error::index.html 没有注入 bridge.js"; fail=1; }
          BRIDGE_LINE=$(grep -n 'src="bridge.js"' desktop/dist/index.html | cut -d: -f1 | head -1)
          VERSION_LINE=$(grep -n 'src="js/version.js"' desktop/dist/index.html | cut -d: -f1 | head -1)
          if [ -n "$BRIDGE_LINE" ] && [ -n "$VERSION_LINE" ]; then
            if [ "$BRIDGE_LINE" -ge "$VERSION_LINE" ]; then
              echo "::error::bridge.js 必须在 version.js 之前（实际 $BRIDGE_LINE vs $VERSION_LINE）"
              fail=1
            else
              echo "注入顺序正确：bridge.js 在 $BRIDGE_LINE 行，version.js 在 $VERSION_LINE 行"
            fi
          fi
          # 3. 桌面端不应带 Service Worker
          test ! -f desktop/dist/sw.js || { echo "::error::桌面端不该有 sw.js"; fail=1; }
          exit $fail

      - name: JS 语法检查（含桥接层）
        run: |
          fail=0
          for f in desktop/dist/js/*.js desktop/dist/bridge.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: 版本号与 version.json 一致
        run: |
          V=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          CONF=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "version.json=$V tauri.conf.json=$CONF"
          [ "$V" = "$CONF" ] || { echo "::error::版本号不一致"; exit 1; }

  # ------------------------------------------------------------------
  # 第 3 关：实际打包
  #
  # 三个平台各打各的包。macOS 默认参与（主人要求三端），
  # 但可以在手动 dispatch 时关掉以省额度。
  #
  # ⚠️ 产物只作为 Artifact 上传，不进 Release。
  #    为什么：CI 里没法真正测「点开能不能用」——GUI 交互、
  #    登录、播放这些必须人在真实桌面上点。先进 Artifact 让人验，
  #    验过了再决定要不要发。
  # ------------------------------------------------------------------
  bundle:
    name: 打包（${{ matrix.label }}）
    needs: [test, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux-x64
            artifact: linux-x64
          - os: windows-latest
            label: Windows-x64
            artifact: windows-x64
          - os: macos-latest
            label: macOS-arm64
            artifact: macos-arm64
        # 手动 dispatch 且 build_macos=false 时剔除 macOS 那一项。
        #
        # 为什么用 matrix exclude 而不是 job 级 if：
        # job 级 `if` **不认 `matrix` 上下文**（matrix 只在 strategy 展开后
        # 的 step 级才存在）。写成 `if: matrix.os != 'macos-latest'` 会让整个
        # workflow 在解析阶段校验失败，报 "Unrecognized named-value: 'matrix'"；
        # 那种失败的形态极具误导性 —— run 会被创建、却**一个 job 都不跑**
        # （created_at 与 updated_at 同一秒、日志接口 404），从 Actions 页面
        # 完全看不出原因。另外 `if: |` 多行字面量同样非法，它只接受单行表达式。
        exclude: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_macos == false) && fromJSON('[{"os":"macos-latest"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 组装前端
        run: bash desktop/build-frontend.sh

      # 用 cargo 直接打包，不装 @tauri-apps/cli：
      # 这样整个桌面端构建**零 npm 依赖**，与本项目「不引入前端构建链」
      # 的取向尽量保持一致（虽然 cargo 依赖无法避免）。
      - name: 安装 tauri-cli
        run: |
          cargo install tauri-cli --version "^2" --locked || cargo install tauri-cli --version "^2"

      - name: 打包
        working-directory: desktop/src-tauri
        run: cargo tauri build --verbose
        env:
          # 未配置代码签名证书时，明确告诉 Tauri「就是不打签名」，避免它去
          # 找证书然后失败。README 里会写清用户侧的绕过方法。
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: 列出产物
        shell: bash
        run: |
          echo "=== 产物清单 ==="
          find desktop/src-tauri/target/release -maxdepth 2 \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.app" -o -name "*.dmg" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "ripple" \) \
            -not -path "*/deps/*" -not -path "*/build/*" 2>/dev/null | sort || true

      - uses: actions/upload-artifact@v7
        with:
          name: ripple-desktop-${{ matrix.artifact }}
          # 只收最终安装包与可执行文件；中间文件（.o/.rlib/deps）不收
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/src-tauri/target/release/ripple
            desktop/src-tauri/target/release/ripple.exe
          if-no-files-found: error
          retention-days: 14

      - name: 写入 Job 摘要
        shell: bash
        run: |
          {
            echo "## Ripple 桌面端 · ${{ matrix.label }}"
            echo ""
            echo "> ⚠️ 这是**验证版产物**，只作为 Artifact 保留 14 天，不会进公开 Release。"
            echo "> 请下载后实测：能否启动、界面是否正常、能否登录与播放。"
            echo ""
            echo "### 下一步（未签名包的用户侧处理）"
            echo ""
            echo "- **Windows**：SmartScreen 会提示「Windows 已保护你的电脑」→ 点「更多信息」→「仍要运行」"
            echo "- **Linux**：\`chmod +x\` 后直接运行；deb 用 \`sudo dpkg -i\` 安装"
            echo ""
            echo "[→ Artifacts 列表](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
