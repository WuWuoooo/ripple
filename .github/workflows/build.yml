name: build

on:
  push:
    branches:
      - master
      - main
      # 桌面端分支也要跑 Android 检查：它的存在意义就是「只加桌面端、
      # 不动 app/ 与 android/」。但如果没有这条，这个承诺就只是**口头**的 ——
      # 推 8 次 CI 一次都不会验证 Android 还能不能编译。
      # 加上它以后，"桌面端没有破坏 Android" 才是一个被机器守住的结论。
      - 'feat/desktop-*'
  pull_request:
  workflow_dispatch:

# 同一分支重复推送时取消上一次，省额度也省等待
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；发布 Release 的那个 job 自己再提权
permissions:
  contents: read

jobs:
  check:
    name: 语法与一致性检查
    runs-on: ubuntu-24.04      # 固定版本：ubuntu-latest 即将迁到 26，SDK 组件对系统版本敏感
    steps:
      - uses: actions/checkout@v7

      # 用 runner 自带的 Node，不必为了 --check 再装一个运行时
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JS 语法检查
        run: |
          fail=0
          for f in app/js/*.js app/sw.js server.js; do
            echo "→ $f"
            node --check "$f" || fail=1
          done
          exit $fail

      # 纯逻辑的单元测试（Node 内置 test runner，不需要 npm install）。
      # 目前只覆盖 app/js/lrc.js：LRC 解析、同时间戳去重、原文/译文最近邻合并。
      # 走 tests/run.sh 而不是直接 `node --test tests/`：目录参数在部分 Node 构建
      #（含本机 24.22.1）上会报 ERR_UNSUPPORTED_DIR_IMPORT，脚本里显式展开文件列表。
      # 审查 3.1：这是本仓库**头号缺陷模式**的结构性防护。
      #
      # 四轮审查里最集中的主题都是「同一份名单抄成多份，然后各走各的」——
      # 1.3.0 又复发四处（扫码状态码漏 803 → 扫码登录全断；Rust 上游路径写错 →
      # 桌面漫游 404；首页缓存清理漏项；版本号四处漂移）。
      # 这类缺陷单看任何一处都「读起来没问题」，只有把几处放一起比才看得出来，
      # 所以最有效的办法不是「注意一点」，而是让机器替人比对。
      - name: 名单一致性（三端命令/路径/状态码/版本号）
        run: node scripts/check-manifest-consistency.js

      - name: 单元测试
        run: bash tests/run.sh

      # 只编译不发布：push/PR 阶段就要能发现 Java 编译错误和资源/manifest 错误。
      # 签名、打包、发布仍然只走 build job（workflow_dispatch）。
      #
      # 必须先生成 R.java 再编译 Java：PlaybackService.java 引用 R.drawable.*，
      # 只拿 android.jar 编译会报 "package R does not exist"。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件（编译校验用）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: Java / 资源 / manifest 编译校验
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          OUT="$(mktemp -d)"
          mkdir -p "$OUT/gen" "$OUT/classes"

          echo "→ aapt2 compile（资源）"
          "$BT/aapt2" compile --dir android/app/src/main/res -o "$OUT/res.zip"

          # aapt2 link 同时校验 manifest 与资源引用，并生成 R.java。
          # 源码 manifest 按 AGP 8 的写法不带 package（由 build-apk.sh 用
          # --rename-manifest-package 注入），但 aapt2 link 自身要求 manifest 里必须有
          # package 属性，所以这里先在构建副本里补上，源码一行不动。
          echo "→ aapt2 link（manifest + 资源 + 生成 R.java）"
          python3 - "$OUT/AndroidManifest.xml" <<'PY'
          import re, sys
          src = open('android/app/src/main/AndroidManifest.xml', encoding='utf-8').read()
          def inject(m):
              tag = m.group(0)
              return tag if 'package=' in tag else tag.replace('<manifest', '<manifest package="com.ripple.app"', 1)
          out, n = re.subn(r'<manifest[ ][^>]*>', inject, src, count=1)
          if n != 1:
              sys.exit('找不到 <manifest> 开标签，manifest 格式异常')
          open(sys.argv[1], 'w', encoding='utf-8').write(out)
          PY
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$JAR" \
            --manifest "$OUT/AndroidManifest.xml" --java "$OUT/gen" \
            --min-sdk-version 24 --target-sdk-version 34 \
            --version-code 1 --version-name 0.0.0 "$OUT/res.zip"

          # 与 build-apk.sh 保持一致：产物 manifest 里必须真的有包名
          "$BT/aapt2" dump packagename "$OUT/base.apk" | grep -q "com.ripple.app" \
            || { echo "::error::aapt2 link 之后 base.apk 里没有 package=com.ripple.app"; exit 1; }

          echo "→ javac（含生成的 R.java）"
          javac -encoding UTF-8 -nowarn -source 17 -target 17 -classpath "$JAR" \
            -d "$OUT/classes" \
            $(find android/app/src/main/java "$OUT/gen" -name '*.java')

          echo "编译校验通过：$(find "$OUT/classes" -name '*.class' | wc -l) 个 class"

      - name: 文档与仓库现状一致（仅告警）
        run: |
          # README 里写了「Java 外壳（N 个类）」。这个数字以前是错的（写 8，实际 10），
          # 加一条告警让它在新增/删除 Java 文件时自己冒出来，而不是等读者发现。
          # 只告警不失败：数量对不上不影响构建，不该拦住 PR。
          ACTUAL=$(find android/app/src/main/java -name '*.java' | wc -l | tr -d ' ')
          DOC=$(sed -n 's/.*Java 外壳（\([0-9]\+\) 个类.*/\1/p' README.md | head -1)
          if [ -z "$DOC" ]; then
            echo "::warning::README.md 里没找到「Java 外壳（N 个类）」这句，检查一下项目结构一节"
          elif [ "$ACTUAL" != "$DOC" ]; then
            echo "::warning::README.md 写 $DOC 个 Java 类，实际 $ACTUAL 个。请更新 README.md 与 CONTRIBUTING.md 的代码结构树。"
          else
            echo "Java 类数一致：$ACTUAL"
          fi

      - name: 检查敏感文件没被提交
        run: |
          bad=0
          for f in .ripple-cookie .ripple-token; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::不应提交 $f"
              bad=1
            fi
          done
          # debug keystore 是公开密码的调试证书，必须入库以保持签名稳定
          if ! git ls-files --error-unmatch android/debug.keystore >/dev/null 2>&1; then
            echo "::error::android/debug.keystore 未被版本控制：每次全新 checkout 都会生成新密钥，发布的 APK 签名将不稳定"
            bad=1
          fi
          # 再扫一遍内容，防止有人换了文件名又塞回来
          for f in .ripple-cookie .ripple-token; do
            if [ -e "$f" ]; then echo "::warning::$f 存在于工作区（本地开发正常，确认已被忽略）"; fi
          done
          exit $bad

      - name: 构建产物没有被误提交
        run: |
          bad=0
          for pat in "*.apk" "*.aab" "android/build-manual/*" "android/app/src/main/assets/www/*"; do
            hits=$(git ls-files "$pat" || true)
            if [ -n "$hits" ]; then
              echo "::error::构建产物被提交了：$pat"
              echo "$hits" | head -5
              bad=1
            fi
          done
          exit $bad

      - name: 版本号一致性
        run: |
          if [ ! -f version.json ]; then
            echo "::error::缺少 version.json"
            exit 1
          fi
          VC=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]\+\).*/\1/p' version.json | head -1)
          VN=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          echo "version.json → $VN ($VC)"
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "::error::version.json 解析失败"
            exit 1
          fi
          # 这几处由 build-apk.sh 自动同步；不一致说明有人手改了，必须失败而不是告警。
          # 注意用词边界：`grep -q "versionCode 11"` 会命中 `versionCode 110`，
          # 那样 110 和 11 互相通过，等于没校验。必须要求数字后紧跟非数字或行尾。
          bad=0
          grep -Eq "versionCode[[:space:]]+$VC([^0-9]|$)" android/app/build.gradle \
            || { echo "::error::build.gradle versionCode 与 version.json 不一致（期望 $VC）"; bad=1; }
          grep -Eq "versionName[[:space:]]+'$VN'([^0-9.]|$)" android/app/build.gradle \
            || { echo "::error::build.gradle versionName 与 version.json 不一致（期望 $VN）"; bad=1; }
          # version.js 由脚本生成但必须入库（网页版直接引用），这里校验内容已同步
          if [ -f app/js/version.js ]; then
            grep -Eq "name: '$VN'" app/js/version.js \
              || { echo "::error::app/js/version.js 的 name 与 version.json 不一致"; bad=1; }
            grep -Eq "code: $VC([^0-9]|$)" app/js/version.js \
              || { echo "::error::app/js/version.js 的 code 与 version.json 不一致"; bad=1; }
          else
            echo "::error::缺少 app/js/version.js（网页版会 404，请先跑一次 build-apk.sh）"
            bad=1
          fi
          # 两个 Java 文件里的版本号也由 sync-version.sh 同步，同样入库，
          # 仓库里跑构建会写回它们 —— 忘了跑会出现「代码里写 1.1.0，version.json 已 1.2.0」。
          grep -qF "version: $VN (\" + $VC + \")" \
              android/app/src/main/java/com/ripple/app/CrashLog.java \
            || { echo "::error::CrashLog.java 的 version 行与 version.json 不一致（期望 version: $VN (\" + $VC + \")）"; bad=1; }
          grep -qF "version=$VN($VC)" \
              android/app/src/main/java/com/ripple/app/RippleApp.java \
            || { echo "::error::RippleApp.java 的 version= 与 version.json 不一致（期望 version=$VN($VC)）"; bad=1; }
          # Service Worker 的缓存名必须等于 ripple-<versionCode>（没有 v 前缀）。
          # 这一条以前没有，于是「忘了提升 versionCode」在 CI 里是查不出来的：
          # 已装用户会继续跑旧壳，表现为「改了没生效」。
          if [ -f app/sw.js ]; then
            SWC=$(sed -n "s/^const CACHE = '\([^']*\)'.*/\1/p" app/sw.js | head -1)
            echo "app/sw.js → CACHE='$SWC'"
            if [ "$SWC" != "ripple-$VC" ]; then
              echo "::error::app/sw.js 的 CACHE 应为 'ripple-$VC'（实际 '$SWC'）。它由 sync-version.sh 按 versionCode 自动同步，请改 version.json 后重跑构建，不要手改。"
              bad=1
            fi
          else
            echo "::error::缺少 app/sw.js"
            bad=1
          fi

          # ------------------------------------------------------------------
          # 审查 U-05：桌面端三处版本副本也必须在这里校验。
          #
          # 以前这段只覆盖 Android 侧 5 处，桌面端两个副本（Cargo.toml / Cargo.lock）
          # 无人看管 —— 这正是 D-02「Cargo.toml 停在 1.2.3」能长期存活的原因。
          # 现在两个 workflow 交叉校验：Android 这边也查桌面端。
          # ------------------------------------------------------------------
          if [ -f desktop/src-tauri/tauri.conf.json ]; then
            CONF=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
            [ "$CONF" = "$VN" ] \
              || { echo "::error::desktop/src-tauri/tauri.conf.json 版本 $CONF ≠ version.json $VN"; bad=1; }
            CV=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
            [ "$CV" = "$VN" ] \
              || { echo "::error::Cargo.toml [package] version $CV ≠ version.json $VN"; bad=1; }
            CLV=$(awk '/^name = "ripple-desktop"$/{f=1;next} f && /^version = /{gsub(/[^0-9.]/,"");print;exit}' \
                    desktop/src-tauri/Cargo.lock)
            [ "$CLV" = "$VN" ] \
              || { echo "::error::Cargo.lock 的 ripple-desktop 版本 $CLV ≠ version.json $VN"; bad=1; }
            echo "桌面端版本副本：tauri.conf.json=$CONF Cargo.toml=$CV Cargo.lock=$CLV"
          else
            echo "::error::缺少 desktop/src-tauri/ 目录"
            bad=1
          fi

          exit $bad

  build:
    name: 构建 APK
    runs-on: ubuntu-24.04      # 同上，固定版本避免底层镜像迁移导致构建失败
    needs: check
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write          # 创建 Release 并上传资产
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 审查 D-05：已存在的同版本 tag 必须指向当前 HEAD。
      #
      # 1.3.0 发版时就出过这件事：Release 里的 6 个产物是 1.3.0（来自 ecd1eaa），
      # 而 tag v1.3.0 指向 e3f1cd2 —— 一个提交信息就叫「1.2.3」的旧提交，
      # 那个提交里连 desktop/ 目录都没有。后果是从源码构建 1.3.0 会得到 1.2.3，
      # GitHub 的 Code → Download ZIP 也是旧内容，而 README 正在让用户从源码构建。
      #
      # 这里在构建前就挡住：如果 tag 已存在却指向别的提交，直接失败并给出修法，
      # 而不是等到发完 Release 才发现二进制与源码对不上。
      - name: tag 与 version.json / HEAD 一致（防 tag 错位）
        run: |
          VN=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          TAG="v$VN"
          echo "version.json=$VN  tag=$TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            echo "tag 指向: $TAG_SHA"
            echo "HEAD    : $HEAD_SHA"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::tag $TAG 指向 $TAG_SHA，不是当前 HEAD $HEAD_SHA —— 从该 tag 构建会得到别的版本。"
              echo "修法：git tag -f $TAG $HEAD_SHA && git push origin $TAG --force"
              exit 1
            fi
            echo "✅ tag 与 HEAD 一致"
          else
            echo "tag $TAG 尚不存在（首次发布），跳过校验"
          fi

      # 签名稳定性是「能不能覆盖升级」的前提。CI 每次都是全新 checkout，
      # 如果 keystore 没入库，build-apk.sh 会生成一把新密钥 —— 每个版本的
      # 证书指纹都不一样，用户必须卸载再装。这里直接失败，不要静默凑合。
      - name: 校验 debug keystore 存在
        run: |
          KS=android/debug.keystore
          if [ ! -f "$KS" ]; then
            echo "::error::$KS 不存在。它必须提交到仓库：CI 每次全新 checkout，缺了就只能生成新密钥，发布的 APK 签名会每版不同。"
            exit 1
          fi
          echo "keystore 存在：$(ls -l "$KS")"
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -i "SHA1\|SHA-256" || true

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" > /dev/null
          echo "已安装："
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"

      # runner 已经把 ANDROID_HOME / ANDROID_SDK_ROOT 设好了，
      # 不要在 env 里写 ${{ env.ANDROID_HOME }} —— job 级 env 为空时它会展开成空串，
      # 反而把 runner 自带的值盖掉。脚本自己会读这两个变量。
      - name: 构建
        run: bash android/build-apk.sh

      - name: 显示产物信息
        run: |
          # 只认最终产物：build-manual/ 里还有 base.apk / aligned.apk 等中间文件
          APK=$(ls android/build-manual/Ripple-*.apk | head -1)
          echo "产物：$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -1

      # Artifact 是临时产物（需登录、有过期时间），只当兜底留存。
      # 真正给人下载的是 Release 资产 —— 下面这一步负责发布。
      #
      # 只传最终的 Ripple-*.apk：build-manual/ 里还有 base.apk（未签名、无 dex）、
      # aligned.apk、unaligned.apk 这些中间产物，一起传上去只会让人下错包。
      - uses: actions/upload-artifact@v7
        with:
          name: ripple-apk
          path: android/build-manual/Ripple-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 整理发布用的文件名
        id: meta
        run: |
          VC=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]\+\).*/\1/p' version.json | head -1)
          VN=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC"     >> "$GITHUB_OUTPUT"
          echo "tag=v$VN"     >> "$GITHUB_OUTPUT"

          SRC=$(ls android/build-manual/Ripple-*.apk | head -1)
          # 发布出去的名字去掉 -debug，看着体面些
          OUT="Ripple-${VN}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "产物：$OUT"
          echo "SHA256：$SHA"

      - name: 从 CHANGELOG 提取本版说明
        id: notes
        run: |
          VN="${{ steps.meta.outputs.version }}"
          # versionCode 也要在这里重新取一次。
          # ⚠️ 上一版这里只声明了 VN，而下面「埋 versionCode 标记」那段用的是 $VC ——
          # 那个 VC 是**上一个 step**（meta）里的局部变量，跨 step 根本不存在，
          # 于是渲染出来是 `<!-- ripple-version-code:  -->`，数字整个是空的。
          # 而 App 内「检查更新」正是靠这行判新旧 → 它永远解析失败，
          # 只能退化成版本名比较（1.3.10 vs 1.3.9 就会判错）。
          # 这次 1.3.5 的 Release 就是带着一个空标记发出去的，已确认是空的。
          VC="${{ steps.meta.outputs.code }}"
          OUT=/tmp/notes.md
          ZH=/tmp/notes_zh.md
          EN=/tmp/notes_en.md

          # 从 CHANGELOG 抓某一版的段落：从本版标题行开始，到下一个 "## " 之前。
          # 标题行会保留（发布正文需要一个像样的开头），尾部多余的分隔线一并裁掉。
          extract() {
            _file="$1"; _out="$2"
            if [ -f "$_file" ] && grep -q "^## $VN" "$_file"; then
              awk -v v="$VN" '
                $0 ~ "^## "v"([ ]|$)" { on=1 }
                on && NR > 1 && /^## / && $0 !~ "^## "v"([ ]|$)" { exit }
                on { print }
              ' "$_file" | awk '{ lines[NR]=$0 } END {
                # 从尾部回删空行与 "---"
                n=NR
                while (n>0 && (lines[n]=="" || lines[n]=="---" || lines[n]==" ")) n--
                for (i=1;i<=n;i++) print lines[i]
              }' > "$_out"
              echo "已从 $_file 提取 $VN 的说明（$(wc -l < "$_out") 行）"
              return 0
            fi
            return 1
          }

          extract CHANGELOG.md "$ZH" || {
            {
              echo "## Ripple $VN"
              echo ""
              echo "本版未在 CHANGELOG.md 中找到对应段落，详见仓库提交记录。"
            } > "$ZH"
            echo "CHANGELOG.md 里没有 $VN 的段落，使用中文占位说明"
          }

          extract docs/en/CHANGELOG_en.md "$EN" || {
            {
              echo "## Ripple $VN"
              echo ""
              echo "This version has no matching section in CHANGELOG_en.md; see the commit history."
            } > "$EN"
            echo "docs/en/CHANGELOG_en.md 里没有 $VN 的段落，使用英文占位说明"
          }

          # ===== 折叠：解决「更新内容太长、用户要一直下拉、还容易划过头」 =====
          #
          # 现象：1.3.x 起每版 CHANGELOG 有 9 个左右的三级小节，中英双版叠加后
          # 正文常有 400+ 行。GitHub Release 是整页滚动，用户想找「安装包 /
          # SHA-256」得一路往下拉；拉到之后想回到某一节又要往上爬，很容易划过头。
          #
          # 方案（三层，全部用 GitHub 原生支持的 <details>）：
          #   ① 顶部一小块「本版包含」，列出所有三级小节标题 —— 不折叠，
          #      用户一眼看出这版覆盖了哪几块；
          #   ② 中文正文整体放进 <details open>（默认展开：中文是主要读者）；
          #   ③ 英文正文放进 <details>（默认收起：非中文读者自己点开）。
          #
          # 这样默认页面高度压到几十行，「安装包 / SHA-256」就在一两屏内。
          # 好处还在于：内容一个字都不删（想复查细节可以展开），
          # 而且是 GitHub 渲染层原生折叠，不依赖任何平台特性。
          #
          # ⚠️ 两个必须遵守的格式细节，否则折叠块会渲染成一堆纯文本：
          #   · <summary> 与 </summary> 必须在同一行，中间不能换行；
          #   · <details> 后面的内容要空一行，Markdown 才会被当成 Markdown 解析。
          # 指纹直接从**成品 APK** 读，而不是从 keystore 猜：
          # 用户真正关心的是「这个包是什么签名」，而 apksigner --print-certs 给的
          # 是实际打包用的证书摘要（顺带兼容 keytool 各版本 "SHA256:" / "SHA-256:" 的差异）。
          CERT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
                   "${{ steps.meta.outputs.file }}" 2>/dev/null \
                 | sed -n "s/^Signer #1 certificate SHA-256 digest: //p" | head -1)
          echo "签名证书 SHA-256：${CERT:-（读取失败）}"

          ZH_LINES=$(wc -l < "$ZH")
          EN_LINES=$(wc -l < "$EN")
          ZH_TOC=$(grep -E '^### ' "$ZH" | sed 's/^###[[:space:]]*//' | sed 's/^/- /' || true)
          if [ -z "$ZH_TOC" ]; then
            ZH_TOC="- （本版无小节标题 / no subsection headings）"
          fi

          {
            # 头部：标题 + 本版要点清单（不折叠）。
            # 这部分和下面的折叠块分开写，是为了让「安装包」区块能插在中间。
            echo "> 本文档为中英双语 · This release note is bilingual (Chinese / English)."
            echo ""
            echo "**本版包含 / What's in this release**"
            echo ""
            echo "$ZH_TOC"
            echo ""
            # 机器可读的 versionCode（1.3.4）：
            # GitHub Release API 不提供 versionCode（只存在于 APK 内部），
            # 而 App 内「检查更新」必须按整数比版本 ——
            # 按版本名字符串比会在 1.3.10 vs 1.3.9 上判错。
            # 埋一行 HTML 注释给它解析；找不到时 App 端退化成版本名比较。
            # 防呆：VC 为空就直接让这一步失败。
            # 上一版就是因为它为空而**静默**发了一个解析不出新旧版本的 Release，
            # 直到发布后人工核对才发现 —— 这类「产物看起来正常、但一行关键元数据是空的」
            # 必须由 CI 自己拦住，而不是靠人记得去查。
            if [ -z "$VC" ]; then
              echo "::error::versionCode 为空 —— Release 正文会写成空的 version-code 标记，App 内检查更新将永远解析失败。请检查 steps.meta.outputs.code 是否已传出。"
              exit 1
            fi
            echo "<!-- ripple-version-code: $VC -->"
          } > "$OUT"

          # 安装包在最前（紧跟要点清单），用户不用展开折叠、也不用往下拉就能看到
          {
            echo ""
            echo "---"
            echo ""
            echo "## 安装包 / Artifacts"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            echo "| Android | \`${{ steps.meta.outputs.file }}\` |"
            echo "| Linux | \`Ripple_${VN}_amd64.deb\` · \`Ripple_${VN}_amd64.AppImage\` · \`Ripple-${VN}-linux-x86_64.tar.gz\` |"
            echo "| Windows | \`Ripple_${VN}_x64-setup.exe\` · \`Ripple-${VN}-windows-x64.zip\` |"
            echo ""
            echo "**SHA-256**：\`${{ steps.meta.outputs.sha256 }}\`"
            echo ""
            echo "> 用仓库内固定的 debug keystore 签名，签名跨版本稳定，可直接覆盖安装。"
            echo "> 签名证书 SHA-256：\`${CERT:-unknown}\`"
            echo "> debug 证书的密码是公开的，**不能上架应用商店**；仅供自用 / 内测分发。"
            echo "> minSdk 24 / Android 7.0+。"
            echo "> 校验下载完整性：\`sha256sum ${{ steps.meta.outputs.file }}\`"
            echo ""
            echo "**Unsigned desktop builds**: the Windows/Linux packages are not code-signed. "
            echo "On Windows, SmartScreen -> \"More info\" -> \"Run anyway\". "
            echo "On Linux, \`chmod +x\` the AppImage/tar.gz, or \`sudo dpkg -i\` the deb."
          } >> "$OUT"

          # 折叠正文：中英各一个 <details>
          # 前面必须空一行，否则 <details> 会被当成上一段文字的延续，
          # GitHub 就不会把它渲染成折叠块。
          {
            echo ""
            echo "<details open>"
            echo "<summary><b>中文说明</b>（${ZH_LINES} 行 · 点击展开或收起）</summary>"
            echo ""
            cat "$ZH"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><b>English notes</b> (${EN_LINES} lines · click to expand or collapse)</summary>"
            echo ""
            cat "$EN"
            echo ""
            echo "</details>"
          } >> "$OUT"
          echo "中英双版正文已合并（带折叠）：$(wc -l < "$OUT") 行（中文 $(wc -l < "$ZH") + 英文 $(wc -l < "$EN")）"

          {
            echo "body<<__EOF__"
            cat "$OUT"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FILE="${{ steps.meta.outputs.file }}"

          # 同版本重跑时不炸：已存在就更新说明 + 覆盖资产
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明并覆盖资产"
            gh release edit "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$FILE" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$FILE" \
              --title "Ripple ${TAG#v}" \
              --notes-file /tmp/notes.md \
              --latest
          fi

          echo "完成：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      - name: 写入 Job 摘要
        run: |
          {
            echo "## Ripple ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.meta.outputs.file }}\` |"
            echo "| 大小 | $(du -h "${{ steps.meta.outputs.file }}" | cut -f1) |"
            echo "| versionCode | ${{ steps.meta.outputs.code }} |"
            echo "| SHA-256 | \`${{ steps.meta.outputs.sha256 }}\` |"
            echo ""
            echo "[→ 下载页面](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"

