name: build

on:
  push:
    branches:
      - master
      - main
      # 桌面端分支也要跑 Android 检查：它的存在意义就是「只加桌面端、
      # 不动 app/ 与 android/」。但如果没有这条，这个承诺就只是**口头**的 ——
      # 推 8 次 CI 一次都不会验证 Android 还能不能编译。
      # 加上它以后，"桌面端没有破坏 Android" 才是一个被机器守住的结论。
      - 'feat/desktop-*'
  pull_request:
  workflow_dispatch:

# 同一分支重复推送时取消上一次，省额度也省等待
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；发布 Release 的那个 job 自己再提权
permissions:
  contents: read

jobs:
  check:
    name: 语法与一致性检查
    runs-on: ubuntu-24.04      # 固定版本：ubuntu-latest 即将迁到 26，SDK 组件对系统版本敏感
    steps:
      - uses: actions/checkout@v7

      # 用 runner 自带的 Node，不必为了 --check 再装一个运行时
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JS 语法检查
        run: |
          fail=0
          # M-7：glob 必须覆盖**子目录**与根目录的其它脚本。
          #
          # 以前只写 app/js/*.js app/sw.js server.js，漏了两类：
          #   · app/js/lang/*.js —— 语言包在子目录里，* 不跨目录。
          #     它是 1.3.5 新增的 700+ 行词典，英文界面的单点。
          #     一个语法错误会让整个英文界面失效，而 CI 当时是绿的。
          #   · server-security.js —— Host 白名单 / 同源判定 / 令牌有效期的
          #     唯一实现，server.js require 它；它有语法错误时 server.js
          #     在 require 阶段直接崩，而 CI 同样不会红。
          # 加新脚本时如果放在别的目录，记得同步这一行（或者改成 find）。
          for f in app/js/*.js app/js/lang/*.js app/sw.js server.js server-security.js \
                   desktop/bridge.js scripts/*.js tests/*.js; do
            [ -f "$f" ] || continue
            echo "→ $f"
            node --check "$f" || fail=1
          done
          exit $fail

      # 纯逻辑的单元测试（Node 内置 test runner，不需要 npm install）。
      # 目前只覆盖 app/js/lrc.js：LRC 解析、同时间戳去重、原文/译文最近邻合并。
      # 走 tests/run.sh 而不是直接 `node --test tests/`：目录参数在部分 Node 构建
      #（含本机 24.22.1）上会报 ERR_UNSUPPORTED_DIR_IMPORT，脚本里显式展开文件列表。
      # 审查 3.1：这是本仓库**头号缺陷模式**的结构性防护。
      #
      # 四轮审查里最集中的主题都是「同一份名单抄成多份，然后各走各的」——
      # 1.3.0 又复发四处（扫码状态码漏 803 → 扫码登录全断；Rust 上游路径写错 →
      # 桌面漫游 404；首页缓存清理漏项；版本号四处漂移）。
      # 这类缺陷单看任何一处都「读起来没问题」，只有把几处放一起比才看得出来，
      # 所以最有效的办法不是「注意一点」，而是让机器替人比对。
      - name: 名单一致性（三端命令/路径/状态码/版本号）
        run: node scripts/check-manifest-consistency.js

      # H-16：这两条 1.3.8 最关键的回归测试（卡拉OK 染色对齐 / 封面尺寸抖动）
      # 需要一个**真浏览器**，而以前 tests/lyric-karaoke-align.test.js 里写死的是
      # 本机绝对路径 /opt/chrome/chrome-linux64/chrome。CI runner 上没有那个路径，
      # 于是两条测试永远 skip —— 本地绿、CI 绿，但 CI 上那条防线根本不存在。
      #
      # 现在：① 测试脚本按 CHROME_PATH 环境变量 + PATH 常见名字解析浏览器；
      #       ② 这里先装 chromium 并把路径写进 $GITHUB_ENV，下面的「单元测试」
      #          步骤就会真的跑那两条（而不是静默 skip）。
      # 用 apt 的 chromium 包而不是 npx playwright install：本仓库刻意不引入
      # npm 依赖（见 CONTRIBUTING），apt 一步到位且不需要 package.json。
      - name: 安装 headless Chrome（H-16：让卡拉OK/封面测试在 CI 上真跑）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser chromium || \
            sudo apt-get install -y --no-install-recommends chromium
          CHROME_BIN=""
          for c in /usr/bin/chromium-browser /usr/bin/chromium /usr/bin/google-chrome /snap/bin/chromium; do
            if [ -x "$c" ]; then CHROME_BIN="$c"; break; fi
          done
          if [ -z "$CHROME_BIN" ]; then
            # 装不上就明确告警：这两条会被 skip，但不能让这件事静默发生
            echo "::warning::CI 上装不上 chromium，卡拉OK/封面两条真浏览器测试将被 skip"
          else
            echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
            echo "已安装 Chrome：$CHROME_BIN"
            "$CHROME_BIN" --version || true
          fi

      - name: 单元测试
        run: bash tests/run.sh

      # 只编译不发布：push/PR 阶段就要能发现 Java 编译错误和资源/manifest 错误。
      # 签名、打包、发布仍然只走 build job（workflow_dispatch）。
      #
      # 必须先生成 R.java 再编译 Java：PlaybackService.java 引用 R.drawable.*，
      # 只拿 android.jar 编译会报 "package R does not exist"。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件（编译校验用）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: Java / 资源 / manifest 编译校验
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          OUT="$(mktemp -d)"
          mkdir -p "$OUT/gen" "$OUT/classes"

          echo "→ aapt2 compile（资源）"
          "$BT/aapt2" compile --dir android/app/src/main/res -o "$OUT/res.zip"

          # aapt2 link 同时校验 manifest 与资源引用，并生成 R.java。
          # 源码 manifest 按 AGP 8 的写法不带 package（由 build-apk.sh 用
          # --rename-manifest-package 注入），但 aapt2 link 自身要求 manifest 里必须有
          # package 属性，所以这里先在构建副本里补上，源码一行不动。
          echo "→ aapt2 link（manifest + 资源 + 生成 R.java）"
          python3 - "$OUT/AndroidManifest.xml" <<'PY'
          import re, sys
          src = open('android/app/src/main/AndroidManifest.xml', encoding='utf-8').read()
          def inject(m):
              tag = m.group(0)
              return tag if 'package=' in tag else tag.replace('<manifest', '<manifest package="com.ripple.app"', 1)
          out, n = re.subn(r'<manifest[ ][^>]*>', inject, src, count=1)
          if n != 1:
              sys.exit('找不到 <manifest> 开标签，manifest 格式异常')
          open(sys.argv[1], 'w', encoding='utf-8').write(out)
          PY
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$JAR" \
            --manifest "$OUT/AndroidManifest.xml" --java "$OUT/gen" \
            --min-sdk-version 24 --target-sdk-version 34 \
            --version-code 1 --version-name 0.0.0 "$OUT/res.zip"

          # 与 build-apk.sh 保持一致：产物 manifest 里必须真的有包名
          "$BT/aapt2" dump packagename "$OUT/base.apk" | grep -q "com.ripple.app" \
            || { echo "::error::aapt2 link 之后 base.apk 里没有 package=com.ripple.app"; exit 1; }

          echo "→ javac（含生成的 R.java）"
          javac -encoding UTF-8 -nowarn -source 17 -target 17 -classpath "$JAR" \
            -d "$OUT/classes" \
            $(find android/app/src/main/java "$OUT/gen" -name '*.java')

          echo "编译校验通过：$(find "$OUT/classes" -name '*.class' | wc -l) 个 class"

      - name: 文档与仓库现状一致（仅告警）
        run: |
          # README 里写了「Java 外壳（N 个类）」。这个数字以前是错的（写 8，实际 10），
          # 加一条告警让它在新增/删除 Java 文件时自己冒出来，而不是等读者发现。
          # 只告警不失败：数量对不上不影响构建，不该拦住 PR。
          ACTUAL=$(find android/app/src/main/java -name '*.java' | wc -l | tr -d ' ')
          DOC=$(sed -n 's/.*Java 外壳（\([0-9]\+\) 个类.*/\1/p' README.md | head -1)
          if [ -z "$DOC" ]; then
            echo "::warning::README.md 里没找到「Java 外壳（N 个类）」这句，检查一下项目结构一节"
          elif [ "$ACTUAL" != "$DOC" ]; then
            echo "::warning::README.md 写 $DOC 个 Java 类，实际 $ACTUAL 个。请更新 README.md 与 CONTRIBUTING.md 的代码结构树。"
          else
            echo "Java 类数一致：$ACTUAL"
          fi

      - name: 检查敏感文件没被提交
        run: |
          bad=0
          for f in .ripple-cookie .ripple-token; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::不应提交 $f"
              bad=1
            fi
          done
          # debug keystore 是公开密码的调试证书，必须入库以保持签名稳定
          if ! git ls-files --error-unmatch android/debug.keystore >/dev/null 2>&1; then
            echo "::error::android/debug.keystore 未被版本控制：每次全新 checkout 都会生成新密钥，发布的 APK 签名将不稳定"
            bad=1
          fi
          # 再扫一遍内容，防止有人换了文件名又塞回来
          for f in .ripple-cookie .ripple-token; do
            if [ -e "$f" ]; then echo "::warning::$f 存在于工作区（本地开发正常，确认已被忽略）"; fi
          done
          exit $bad

      - name: 构建产物没有被误提交
        run: |
          bad=0
          for pat in "*.apk" "*.aab" "android/build-manual/*" "android/app/src/main/assets/www/*"; do
            hits=$(git ls-files "$pat" || true)
            if [ -n "$hits" ]; then
              echo "::error::构建产物被提交了：$pat"
              echo "$hits" | head -5
              bad=1
            fi
          done
          exit $bad

      # ------------------------------------------------------------------
      # B-4（审查 1.3.8）：整段手写版本校验**删掉**，改为调唯一解析器。
      #
      # 这里原来是一大段 grep/sed/awk 抄本，其中桌面端三处用的是
      #   CV=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
      # 也就是「读文件**第一处** version =」。Cargo.toml 里只要 [package]
      # 之前还有一个带 version 的表（[profile.release] / [workspace.metadata]
      # / [[bin]] …），读到的就是那张表的版本 —— 实测构造对抗样本后，
      # [package].version 写 1.2.0、第一处 version 写 1.3.9，
      # 老判据报绿 PASS，而 Tauri 打包实际用的是 1.2.0。
      #
      # 这是同一个缺陷的**第三次复发**（1.3.0 的 D-02、1.3.5 的 B-1、1.3.8 的 B-4），
      # 每次换一个漂移点。所以这次不再「把这处改对」，而是让所有消费方
      # 都调 scripts/version-facts.js —— Cargo.toml 在那里是**段内定位**。
      #
      # version-facts.js 覆盖了原来这整段的全部断言（8 处副本：build.gradle
      # 的 code/name、CrashLog、RippleApp、version.js、sw.js 的 CACHE、
      # tauri.conf.json、Cargo.toml、Cargo.lock），退出码 0/1 语义完备。
      # ------------------------------------------------------------------
      - name: 版本号一致性（唯一解析器 scripts/version-facts.js）
        run: |
          # 只允许这一种校验方式。以后要加副本，改 scripts/version-facts.js 的 COPIES，
          # 不要再在这里抄一份正则 —— 那正是 B-4 的成因。
          node scripts/version-facts.js --assert

  build:
    name: 构建 APK
    runs-on: ubuntu-24.04      # 同上，固定版本避免底层镜像迁移导致构建失败
    needs: check
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write          # 创建 Release 并上传资产
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 审查 D-05：已存在的同版本 tag 必须指向当前 HEAD。
      #
      # 1.3.0 发版时就出过这件事：Release 里的 6 个产物是 1.3.0（来自 ecd1eaa），
      # 而 tag v1.3.0 指向 e3f1cd2 —— 一个提交信息就叫「1.2.3」的旧提交，
      # 那个提交里连 desktop/ 目录都没有。后果是从源码构建 1.3.0 会得到 1.2.3，
      # GitHub 的 Code → Download ZIP 也是旧内容，而 README 正在让用户从源码构建。
      #
      # 这里在构建前就挡住：如果 tag 已存在却指向别的提交，直接失败并给出修法，
      # 而不是等到发完 Release 才发现二进制与源码对不上。
      - name: tag 与 version.json / HEAD 一致（防 tag 错位）
        run: |
          VN=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          TAG="v$VN"
          echo "version.json=$VN  tag=$TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            echo "tag 指向: $TAG_SHA"
            echo "HEAD    : $HEAD_SHA"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::tag $TAG 指向 $TAG_SHA，不是当前 HEAD $HEAD_SHA —— 从该 tag 构建会得到别的版本。"
              echo "修法：git tag -f $TAG $HEAD_SHA && git push origin $TAG --force"
              exit 1
            fi
            echo "✅ tag 与 HEAD 一致"
          else
            echo "tag $TAG 尚不存在（首次发布），跳过校验"
          fi

      # 签名稳定性是「能不能覆盖升级」的前提。CI 每次都是全新 checkout，
      # 如果 keystore 没入库，build-apk.sh 会生成一把新密钥 —— 每个版本的
      # 证书指纹都不一样，用户必须卸载再装。这里直接失败，不要静默凑合。
      - name: 校验 debug keystore 存在
        run: |
          KS=android/debug.keystore
          if [ ! -f "$KS" ]; then
            echo "::error::$KS 不存在。它必须提交到仓库：CI 每次全新 checkout，缺了就只能生成新密钥，发布的 APK 签名会每版不同。"
            exit 1
          fi
          echo "keystore 存在：$(ls -l "$KS")"
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -i "SHA1\|SHA-256" || true

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" > /dev/null
          echo "已安装："
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"

      # runner 已经把 ANDROID_HOME / ANDROID_SDK_ROOT 设好了，
      # 不要在 env 里写 ${{ env.ANDROID_HOME }} —— job 级 env 为空时它会展开成空串，
      # 反而把 runner 自带的值盖掉。脚本自己会读这两个变量。
      - name: 构建
        run: bash android/build-apk.sh

      - name: 显示产物信息
        run: |
          # 只认最终产物：build-manual/ 里还有 base.apk / aligned.apk 等中间文件
          APK=$(ls android/build-manual/Ripple-*.apk | head -1)
          echo "产物：$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -1

      # Artifact 是临时产物（需登录、有过期时间），只当兜底留存。
      # 真正给人下载的是 Release 资产 —— 下面这一步负责发布。
      #
      # 只传最终的 Ripple-*.apk：build-manual/ 里还有 base.apk（未签名、无 dex）、
      # aligned.apk、unaligned.apk 这些中间产物，一起传上去只会让人下错包。
      - uses: actions/upload-artifact@v7
        with:
          name: ripple-apk
          path: android/build-manual/Ripple-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 整理发布用的文件名
        id: meta
        run: |
          VC=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]\+\).*/\1/p' version.json | head -1)
          VN=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' version.json | head -1)
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC"     >> "$GITHUB_OUTPUT"
          echo "tag=v$VN"     >> "$GITHUB_OUTPUT"

          SRC=$(ls android/build-manual/Ripple-*.apk | head -1)
          # 发布出去的名字去掉 -debug，看着体面些
          OUT="Ripple-${VN}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "产物：$OUT"
          echo "SHA256：$SHA"

      # Release 正文由 scripts/release-notes.js 生成，不再写在 YAML 里的 awk。
      #
      # 为什么把逻辑搬进 node 脚本（本次重构的全部理由）：
      #   ① 可测试 —— tests/release-notes.test.js 用临时 fixture 直接 require 它，
      #      覆盖「versionCode 非正整数 / 中英 CHANGELOG 缺该版本段落 / 摘要块里
      #      一条列表项都没有」四个硬失败分支，还有一条元测试故意塞 versionCode=0
      #      证明判据真的会红。写在 YAML 里的 awk 一行都测不了 —— 它只能靠
      #      「推上去看 CI 红不红」验证，而 CI 是绿的也不代表正文是对的。
      #   ② 可本地复现 —— `node scripts/release-notes.js --out /tmp/notes.md`
      #      当场看到 CI 会发出去的正文，不用等一轮 CI、也不用猜。
      #
      # ⚠️ 历史上这一段出过两次事，现在都由新脚本接管成**硬失败**：
      #   · 1.3.5 的正文里那行标记是 `<!-- ripple-version-code:  -->`，数字整个
      #     是空的 —— 旧实现从「上一个 step」取 VC，跨 step 的局部变量根本不存在。
      #     而 App 端解析失败**不报错**、静默退化成版本名比较，于是带空标记的
      #     Release 被静默发了出去。脚本现在自己读 version.json，不是正整数就
      #     退出码 1，不再靠人记得去查。
      #   · 1.3.x 的正文越写越长：9 个小节 + 中英双版 + 安装包表格 + SHA-256 +
      #     <details> 折叠，400+ 行。用户明确要求只要「本次更新 / This release」
      #     两块摘要 —— 安装包清单和下载方式 README 里早写着，Release 页面再抄
      #     一遍只是让人多滚几屏。脚本只取版本段落里**第一个 --- 之前**的
      #     ### 小标题与 - 列表项，详情留在 CHANGELOG.md 里给想深看的人。
      - name: 生成 Release 正文
        id: notes
        # id 必须保持 notes。当前下游「发布到 Release」是直接用 /tmp/notes.md
        # 的（gh release --notes-file），并不读 outputs.body —— 但仍然照样把
        # body 写进 $GITHUB_OUTPUT，保持与旧 step 的接口一致，免得哪天有人
        # 加了 `${{ steps.notes.outputs.body }}` 的引用却拿到空值。
        run: |
          # versionCode / versionName 都由脚本从 version.json 自己读（刻意不再
          # 透传 steps.meta.outputs.*：跨 step 传值正是 1.3.5 空标记的根因）。
          node scripts/release-notes.js --out /tmp/notes.md

          # 与旧 step 完全相同的多行输出写法，下游不用改。
          {
            echo "body<<__EOF__"
            cat /tmp/notes.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "Release 正文如下（本地可用 node scripts/release-notes.js 复现）："
          cat /tmp/notes.md

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FILE="${{ steps.meta.outputs.file }}"

          # 同版本重跑时不炸：已存在就更新说明 + 覆盖资产
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明并覆盖资产"
            gh release edit "$TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$FILE" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$FILE" \
              --title "Ripple ${TAG#v}" \
              --notes-file /tmp/notes.md \
              --latest
          fi

          echo "完成：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      - name: 写入 Job 摘要
        run: |
          {
            echo "## Ripple ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.meta.outputs.file }}\` |"
            echo "| 大小 | $(du -h "${{ steps.meta.outputs.file }}" | cut -f1) |"
            echo "| versionCode | ${{ steps.meta.outputs.code }} |"
            echo "| SHA-256 | \`${{ steps.meta.outputs.sha256 }}\` |"
            echo ""
            echo "[→ 下载页面](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }})"
          } >> "$GITHUB_STEP_SUMMARY"

