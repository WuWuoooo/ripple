<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Ripple · 播放页 v2 预览</title>
<style>
/* ============================================================
   Ripple 播放页 v2 · 单页预览
   改动点：
   1) 歌词移到歌手名下面，固定三行，上下渐变淡出
   2) 最底部新增 3 个按钮：评论 / 歌曲详情 / 下载
   3) 随机 + 循环 合并成左侧一个按钮（点按循环切换 4 种模式）
   4) 右侧原循环按钮 → 播放列表
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.9,.24,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --glass-blur:26px;
  --font:"PingFang SC","HarmonyOS Sans SC","Helvetica Neue","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;

  --accent:#8fd3ff;
  --accent-soft:rgba(143,211,255,.17);
  --accent2:#a9a5ff;
  --accent3:#7fe6d0;
  --accent-ink:#07202e;
}

[data-theme="dark"]{
  --bg:#07070b;
  --text:#fff;
  --text2:rgba(255,255,255,.62);
  --text3:rgba(255,255,255,.34);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --panel:rgba(255,255,255,.07);
  --panel2:rgba(255,255,255,.04);
  --glass:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 48%,rgba(255,255,255,.08));
  --glass-border:rgba(255,255,255,.16);
  --glass-hl:rgba(255,255,255,.34);
  --shadow:0 24px 50px -24px rgba(0,0,0,.9);
  --shade:rgba(6,6,10,.55);
}

html,body{height:100%;margin:0}
body{
  background:#05050a;color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}

/* ---------- 手机外壳（桌面看图时用） ---------- */
.stage{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 0%,#14121f,#05050a 70%);
}
.phone{
  position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);
  display:flex;flex-direction:column;
}
@media (min-width:560px) and (min-height:760px){
  .phone{
    width:412px;height:880px;border-radius:44px;
    box-shadow:0 0 0 1px rgba(255,255,255,.10),0 40px 90px -30px rgba(0,0,0,.9);
  }
  .phone::after{ /* 灵动岛观感 */
    content:"";position:absolute;left:50%;top:11px;transform:translateX(-50%);
    width:96px;height:26px;border-radius:14px;background:#000;z-index:40;pointer-events:none;
  }
}

/* ---------- 背景 ---------- */
.np{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.np-bg{
  position:absolute;inset:-16%;z-index:0;
  filter:blur(52px) saturate(160%);opacity:.72;transform:scale(1.1);
  transition:background-image 1s var(--ease);
}
.np-glow{
  position:absolute;left:50%;top:-8%;width:150%;height:60%;z-index:0;pointer-events:none;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 30%,var(--accent-soft),transparent 62%);
  filter:blur(24px);
}
.np-veil{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(6,6,10,.82) 0%,rgba(6,6,10,.18) 22%,transparent 40%,transparent 48%,rgba(7,7,11,.86) 76%,var(--bg) 96%);
}

.np-inner{
  position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0;
  padding:calc(var(--safe-t) + 8px) 22px calc(var(--safe-b) + 10px);
}

/* ---------- 顶栏 ---------- */
.np-top{display:flex;align-items:center;gap:10px;padding:4px 0 8px;flex:none}
.cir{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:var(--panel);border:1px solid var(--line);transition:transform .2s var(--ease),background .2s;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.cir:active{transform:scale(.9)}
.cir svg{width:16px;height:16px}
.np-top .t{flex:1;text-align:center;min-width:0}
.np-top .t b{
  display:block;font-size:9px;letter-spacing:.24em;color:var(--text3);
  text-transform:uppercase;font-weight:600;
}
.np-top .t span{
  display:block;font-size:11px;color:var(--text2);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- 封面 ---------- */
.cover-wrap{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding:2px 0 18px}
.cover{
  position:relative;width:100%;aspect-ratio:1;max-height:100%;
  border-radius:26px;overflow:hidden;
  box-shadow:0 34px 64px -28px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.14);
  transition:transform .42s var(--ease);
}
.cover:active{transform:scale(.985)}
.cover svg,.cover img{width:100%;height:100%;display:block}
.cover .gloss{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(128deg,rgba(255,255,255,.26),transparent 42%,transparent 64%,rgba(255,255,255,.07));
  mix-blend-mode:screen;
}
.cover .sheen{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 78% 88%,rgba(255,255,255,.10),transparent 56%);
}

/* ---------- 歌曲信息 ---------- */
.meta{display:flex;align-items:flex-start;gap:12px;flex:none;margin-top:4px}
.meta .tx{flex:1;min-width:0}
.meta h1{
  font-size:21px;line-height:1.26;font-weight:640;letter-spacing:-.02em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta .art{
  font-size:11.5px;color:var(--text2);margin:6px 0 0;
  display:flex;align-items:center;gap:6px;min-width:0;
}
.meta .art span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .art .vip{
  flex:none;font-size:8px;padding:1.5px 5px;border-radius:5px;letter-spacing:.04em;
  color:#F0C86A;border:1px solid rgba(240,200,106,.38);background:rgba(240,200,106,.12);
}
.like{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--text3);border:1px solid var(--line);transition:.22s var(--ease);
}
.like svg{width:17px;height:17px}
.like.on{color:#ff4f8b;border-color:rgba(255,79,139,.45);background:rgba(255,79,139,.13)}
.like:active{transform:scale(.9)}

/* ---------- 歌词：歌手名下面，固定三行，上下淡出 ---------- */
.lyric{
  flex:none;position:relative;height:calc(var(--lyr-lh) * 3);
  --lyr-lh:27px;
  margin:13px 0 6px;
  display:flex;flex-direction:column;justify-content:center;
  text-align:center;overflow:hidden;
  -webkit-mask:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 14%,#000 36%,#000 64%,rgba(0,0,0,.55) 86%,transparent 100%);
  mask:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 14%,#000 36%,#000 64%,rgba(0,0,0,.55) 86%,transparent 100%);
}
.lyric .ln{
  height:var(--lyr-lh);line-height:var(--lyr-lh);
  font-size:13px;color:var(--text3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .3s var(--ease),font-size .3s var(--ease),opacity .3s var(--ease);
  opacity:.5;
}
.lyric .ln.cur{
  font-size:15.5px;font-weight:600;color:var(--text);opacity:1;
  text-shadow:0 0 26px var(--accent-soft);letter-spacing:-.01em;
}
.lyric .ln.prev,.lyric .ln.next{opacity:.42}
.lyric .ln .tr{display:none}

/* ---------- 进度 ---------- */
.seek{flex:none;margin:6px 0 0}
.seek .bar{
  height:4px;border-radius:3px;background:var(--line2);position:relative;cursor:pointer;
  touch-action:none;
}
.seek .buf{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--line);opacity:.7}
.seek .fill{
  position:absolute;left:0;top:0;bottom:0;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 14px var(--accent-soft);
}
.seek .knob{
  position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5);
  opacity:0;transition:opacity .2s;
}
.seek:active .knob,.seek.dragging .knob{opacity:1}
.seek .tm{
  display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);
  margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:.02em;
}

/* ---------- 主控制行 ---------- */
.ctl{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;
}
.ctl .c{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  color:var(--text2);transition:transform .18s var(--ease),color .2s,background .2s;
  position:relative;
}
.ctl .c svg{width:19px;height:19px}
.ctl .c:active{transform:scale(.9);background:var(--panel)}
.ctl .c.on{color:var(--accent)}

/* 合并后的「模式」按钮：右下角小字标示当前模式 */
.ctl .mode{padding:0}
.ctl .mode .tag{
  position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  font-size:7.5px;letter-spacing:.06em;color:var(--accent);white-space:nowrap;
  opacity:.95;
}
.ctl .mode.on{color:var(--accent)}

.ctl .prev,.ctl .next{width:52px;height:52px;color:var(--text)}
.ctl .prev svg,.ctl .next svg{width:23px;height:23px}

.ctl .main{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent2));
  color:var(--accent-ink);
  box-shadow:0 16px 34px -14px var(--accent),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .16s var(--ease);
}
.ctl .main svg{width:23px;height:23px}
.ctl .main:active{transform:scale(.93)}

/* ---------- 底部 3 个按钮 ---------- */
.actions{
  flex:none;display:flex;gap:8px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line);
}
.actions button{
  flex:1;height:46px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  background:var(--panel);border:1px solid var(--line);color:var(--text2);
  transition:transform .16s var(--ease),background .2s,color .2s,border-color .2s;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.actions button svg{width:16px;height:16px}
.actions button b{font-size:9.5px;font-weight:500;letter-spacing:.02em}
.actions button:active{transform:scale(.96);background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---------- 播放列表 sheet ---------- */
.sheet-mask{
  position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:31;
  max-height:72%;display:flex;flex-direction:column;
  border-radius:26px 26px 0 0;padding:10px 12px calc(var(--safe-b) + 10px);
  background:rgba(20,18,28,.92);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid var(--glass-border);
  box-shadow:0 -22px 50px -24px rgba(0,0,0,.95);
  transform:translateY(101%);transition:transform .38s var(--ease-out);
}
.sheet.on{transform:none}
.sheet .grab{width:34px;height:3px;border-radius:3px;background:var(--line2);margin:0 auto 8px;flex:none}
.sheet .hd{display:flex;align-items:baseline;gap:8px;padding:0 6px 10px;flex:none}
.sheet .hd b{font-size:13px;font-weight:600}
.sheet .hd span{font-size:10px;color:var(--text3)}
.sheet .hd .x{margin-left:auto;color:var(--text3);font-size:11px}
.sheet .list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
.sheet .list::-webkit-scrollbar{display:none}
.qrow{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:12px}
.qrow:active{background:var(--panel)}
.qrow.on{background:var(--accent-soft)}
.qrow .idx{width:16px;font-size:9.5px;color:var(--text3);text-align:center;flex:none;
  font-variant-numeric:tabular-nums}
.qrow.on .idx{color:var(--accent)}
.qrow .tx{flex:1;min-width:0}
.qrow b{display:block;font-size:12px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.on b{color:var(--accent)}
.qrow span{display:block;font-size:10px;color:var(--text3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .du{font-size:10px;color:var(--text3);flex:none;font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toasts{
  position:absolute;left:16px;right:16px;top:calc(var(--safe-t) + 46px);z-index:50;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:15px;
  background:rgba(28,26,38,.88);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);box-shadow:0 18px 40px -22px #000;
  animation:tin .38s var(--ease) both;
}
.toast.out{animation:tout .28s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.97)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.98)}}
.toast .ic{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent);
}
.toast .ic svg{width:14px;height:14px}
.toast .ti b{display:block;font-size:11.5px;font-weight:600}
.toast .ti p{font-size:9.5px;color:var(--text3);margin:2px 0 0}

/* 顶部提示条（说明这是预览稿） */
.hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:60;
  font-size:9px;color:rgba(255,255,255,.28);letter-spacing:.06em;pointer-events:none;
}
@media (max-width:559px){.hint{display:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.2 5.2 0 0 1 12 6.2 5.2 5.2 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z" fill="currentColor"/></symbol>
  <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M12 20.3S5.2 16 3.5 11.8A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 8.5 4.4C18.8 16 12 20.3 12 20.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <!-- 4 种播放模式 -->
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.4" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">1</text></symbol>
  <symbol id="i-order" viewBox="0 0 24 24"><path d="M4 6h9M4 12h9M4 18h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 8v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m14.5 10.5 2.5-2.5 2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <!-- 底部 3 个动作 -->
  <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.4-.6L3 21l1.7-4.5A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v6M12 7.6v.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17 14v5.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="18.6" cy="20" r="1.9" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="stage">
  <div class="phone">

    <section class="np">
      <div class="np-bg" id="npBg"></div>
      <div class="np-glow"></div>
      <div class="np-veil"></div>

      <div class="np-inner">

        <!-- 顶栏 -->
        <div class="np-top">
          <button class="cir" id="btnClose" title="收起"><svg><use href="#i-chev-down"/></svg></button>
          <div class="t">
            <b>正在播放</b>
            <span id="npFrom">每日推荐</span>
          </div>
          <button class="cir" id="btnNext-track" title="换一首示例"><svg><use href="#i-more"/></svg></button>
        </div>

        <!-- 封面 -->
        <div class="cover-wrap">
          <div class="cover" id="cover">
            <div id="coverArt"></div>
            <div class="gloss"></div>
            <div class="sheen"></div>
          </div>
        </div>

        <!-- 歌名 / 歌手 -->
        <div class="meta">
          <div class="tx">
            <h1 id="title">潮汐之间</h1>
            <div class="art">
              <span id="artist">屿声</span>
            </div>
          </div>
          <button class="like" id="btnLike" title="喜欢"><svg><use href="#i-heart-o"/></svg></button>
        </div>

        <!-- 歌词：歌手名下面，三行，上下淡出 -->
        <div class="lyric" id="lyric">
          <div class="ln prev" id="lyr-prev">—</div>
          <div class="ln cur" id="lyr-cur">—</div>
          <div class="ln next" id="lyr-next">—</div>
        </div>

        <!-- 进度 -->
        <div class="seek" id="seek">
          <div class="bar" id="bar">
            <div class="buf" id="buf"></div>
            <div class="fill" id="fill" style="width:0"></div>
            <div class="knob" id="knob" style="left:0"></div>
          </div>
          <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>

        <!-- 控制行：模式(随机+循环合一) / 上一首 / 播放 / 下一首 / 播放列表 -->
        <div class="ctl">
          <button class="c mode on" id="btnMode" title="播放模式">
            <svg><use href="#i-repeat" id="modeIcon"/></svg>
            <span class="tag" id="modeTag">列表</span>
          </button>
          <button class="c prev" id="btnPrev"><svg><use href="#i-prev"/></svg></button>
          <button class="main" id="btnPlay"><svg><use href="#i-pause"/></svg></button>
          <button class="c next" id="btnNext"><svg><use href="#i-next"/></svg></button>
          <button class="c" id="btnQueue" title="播放列表"><svg><use href="#i-queue"/></svg></button>
        </div>

        <!-- 最底部 3 个按钮 -->
        <div class="actions">
          <button id="btnComment"><svg><use href="#i-comment"/></svg><b>评论</b></button>
          <button id="btnDetail"><svg><use href="#i-info"/></svg><b>歌曲详情</b></button>
          <button id="btnDownload"><svg><use href="#i-download"/></svg><b>下载</b></button>
        </div>

      </div>
    </section>

    <!-- 播放列表 -->
    <div class="sheet-mask" id="mask"></div>
    <div class="sheet" id="sheet">
      <div class="grab"></div>
      <div class="hd">
        <b>播放列表</b>
        <span id="qCount">6 首</span>
        <button class="x" id="btnCloseSheet">收起</button>
      </div>
      <div class="list" id="qList"></div>
    </div>

    <div class="toasts" id="toasts"></div>
    <div class="hint">预览稿 · 点顶部「⋯」换示例歌曲 · 点模式按钮看 4 种状态</div>
  </div>
</div>

<script>
/* ============================================================
   预览用的假数据 + 交互
   （真实版本会换成网易云的歌名/封面/歌词）
   ============================================================ */
const TRACKS = [
  {
    title: '潮汐之间', artist: '屿声', album: '潮间带', dur: 94, vip: false,
    hue: 196,
    lrc: [
      [1, '潮水退到第三道沙脊'],
      [10, '留下贝壳和昨天的脚印'],
      [19, '你说海的声音其实很慢'],
      [28, '慢到可以听完一整年'],
      [37, '我在这边 你在那边'],
      [46, '中间隔着一整片蓝'],
      [55, '风把话吹散 又送回来'],
      [64, '像潮汐从不肯走远'],
      [74, '潮水又漫过第三道沙脊'],
      [84, '而我还站在原地'],
    ],
  },
  {
    title: '液态梦境', artist: 'Aurora Lane', album: 'Glasshouse', dur: 88, vip: true,
    hue: 262,
    lrc: [
      [2, 'Vapour on the window'],
      [10, 'I trace your outline slow'],
      [18, 'Everything is melting'],
      [26, 'Into the afterglow'],
      [34, 'Liquid dreams, hold me'],
      [42, "Don't let the morning know"],
      [50, 'Glass is getting warmer'],
      [58, 'Underneath the snow'],
      [68, 'Say it once, say it slow'],
      [78, 'I will let the quiet grow'],
    ],
  },
  {
    title: '折光', artist: '隐修所', album: '光学残影', dur: 96, vip: false,
    hue: 288,
    lrc: [
      [3, '光穿过你 又穿过我'],
      [13, '留下两道折痕'],
      [23, '我们在同一间屋子里'],
      [33, '却折向不同方向'],
      [43, '别关灯'],
      [53, '让我看清这偏差'],
      [63, '别解释'],
      [73, '偏差也是光的一部分'],
      [85, '（尾奏）'],
    ],
  },
  {
    title: '深海电台', artist: '午夜频道', album: 'FM 04:00', dur: 84, vip: false,
    hue: 8,
    lrc: [
      [2, '这里是深海电台'],
      [9, '现在播放的是你的心跳'],
      [16, '请调频到 4 点 17 分'],
      [23, '那里没有广告'],
      [30, '信号穿过三千米的水'],
      [37, '到你耳朵时已经很旧'],
      [44, '但还听得见'],
      [51, '如果你也在失眠'],
      [60, '我们就算同频'],
      [72, '晚安 或者 早安'],
    ],
  },
];

let idx = 0;
let playing = true;
let t = 0;
let mode = 0;               // 0 列表循环 / 1 单曲循环 / 2 顺序播放 / 3 随机播放
const MODES = [
  { key: 'list', icon: 'i-repeat',  tag: '列表',  name: '列表循环' },
  { key: 'one',  icon: 'i-repeat1', tag: '单曲',  name: '单曲循环' },
  { key: 'seq',  icon: 'i-order',   tag: '顺序',  name: '顺序播放' },
  { key: 'rand', icon: 'i-shuffle', tag: '随机',  name: '随机播放' },
];

const $ = (id) => document.getElementById(id);

function coverSVG(hue) {
  const h1 = hue, h2 = (hue + 48) % 360, h3 = (hue + 300) % 360;
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g${hue}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${h1},62%,46%)"/>
        <stop offset=".58" stop-color="hsl(${h2},66%,36%)"/>
        <stop offset="1" stop-color="hsl(${h3},52%,14%)"/>
      </linearGradient>
      <radialGradient id="r${hue}" cx=".72" cy=".82" r=".62">
        <stop offset="0" stop-color="hsl(${h1},90%,72%)" stop-opacity=".55"/>
        <stop offset="1" stop-color="hsl(${h1},90%,72%)" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="400" height="400" fill="url(#g${hue})"/>
    <rect width="400" height="400" fill="url(#r${hue})"/>
    <g fill="none" stroke="rgba(255,255,255,.30)" stroke-width="1">
      <circle cx="300" cy="318" r="70"/>
      <circle cx="300" cy="318" r="112" stroke-opacity=".7"/>
      <circle cx="300" cy="318" r="158" stroke-opacity=".45"/>
      <circle cx="300" cy="318" r="206" stroke-opacity=".26"/>
      <circle cx="300" cy="318" r="256" stroke-opacity=".14"/>
    </g>
    <circle cx="300" cy="318" r="34" fill="rgba(255,255,255,.12)"/>
  </svg>`;
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function applyPalette(hue) {
  document.documentElement.style.setProperty('--accent', `hsl(${hue},74%,68%)`);
  document.documentElement.style.setProperty('--accent2', `hsl(${(hue + 42) % 360},70%,66%)`);
  document.documentElement.style.setProperty('--accent3', `hsl(${(hue + 316) % 360},64%,60%)`);
  document.documentElement.style.setProperty('--accent-soft', `hsla(${hue},74%,68%,.17)`);
}

function render() {
  const tr = TRACKS[idx];
  applyPalette(tr.hue);
  $('coverArt').innerHTML = coverSVG(tr.hue);
  $('npBg').style.backgroundImage = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(coverSVG(tr.hue))}")`;
  $('npBg').style.backgroundSize = 'cover';
  $('npBg').style.backgroundPosition = 'center';
  $('title').textContent = tr.title;
  $('artist').innerHTML = escapeHtml(tr.artist) + (tr.vip ? '<span class="vip">VIP</span>' : '');
  $('npFrom').textContent = '每日推荐 · ' + tr.album;
  $('dur').textContent = fmt(tr.dur);
  renderQueue();
  syncLyric();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- 歌词：只显示上一句 / 当前句 / 下一句 ---------- */
function syncLyric() {
  const tr = TRACKS[idx];
  const lrc = tr.lrc;
  let i = -1;
  for (let k = 0; k < lrc.length; k++) {
    if (lrc[k][0] <= t) i = k; else break;
  }
  const cur = i >= 0 && i < lrc.length ? lrc[i][1] : '♪';
  const prev = i - 1 >= 0 ? lrc[i - 1][1] : '';
  const next = i + 1 < lrc.length ? lrc[i + 1][1] : '';
  $('lyr-prev').textContent = prev;
  $('lyr-cur').textContent = cur;
  $('lyr-next').textContent = next;
}

/* ---------- 进度 ---------- */
function tick() {
  if (playing) {
    t += 0.25;
    const tr = TRACKS[idx];
    if (t >= tr.dur) {
      t = 0;
      if (mode === 1) { /* 单曲循环：原地重来 */ }
      else if (mode === 3) idx = Math.floor(Math.random() * TRACKS.length);
      else if (mode === 2) { playing = false; t = tr.dur; }
      else idx = (idx + 1) % TRACKS.length;
      render();
      syncPlayIcon();
    }
  }
  const tr = TRACKS[idx];
  const p = Math.min(1, t / tr.dur);
  $('fill').style.width = (p * 100) + '%';
  $('knob').style.left = (p * 100) + '%';
  $('buf').style.width = Math.min(100, p * 100 + 22) + '%';
  $('cur').textContent = fmt(t);
  syncLyric();
}
setInterval(tick, 250);

/* ---------- 播放列表 ---------- */
function renderQueue() {
  const tr = TRACKS[idx];
  $('qCount').textContent = TRACKS.length + ' 首';
  $('qList').innerHTML = TRACKS.map((x, i) => `
    <div class="qrow${i === idx ? ' on' : ''}" data-i="${i}">
      <div class="idx">${i === idx ? '▮▮' : String(i + 1).padStart(2, '0')}</div>
      <div class="tx"><b>${escapeHtml(x.title)}</b><span>${escapeHtml(x.artist)}</span></div>
      <div class="du">${fmt(x.dur)}</div>
    </div>`).join('');
}

$('qList').addEventListener('click', (e) => {
  const row = e.target.closest('.qrow');
  if (!row) return;
  idx = +row.dataset.i;
  t = 0;
  playing = true;
  render();
  syncPlayIcon();
  closeSheet();
  toast('正在播放', TRACKS[idx].title);
});

function openSheet() {
  $('mask').classList.add('on');
  $('sheet').classList.add('on');
  renderQueue();
}
function closeSheet() {
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
}
$('btnQueue').addEventListener('click', openSheet);
$('mask').addEventListener('click', closeSheet);
$('btnCloseSheet').addEventListener('click', closeSheet);

/* ---------- 播放模式：一个按钮循环 4 种 ---------- */
function applyMode() {
  const m = MODES[mode];
  $('modeIcon').setAttribute('href', '#' + m.icon);
  $('modeTag').textContent = m.tag;
  $('btnMode').classList.toggle('on', true);
}
$('btnMode').addEventListener('click', () => {
  mode = (mode + 1) % MODES.length;
  applyMode();
  toast('播放模式', MODES[mode].name);
});

/* ---------- 播放控制 ---------- */
function syncPlayIcon() {
  $('btnPlay').innerHTML = `<svg><use href="#i-${playing ? 'pause' : 'play'}"/></svg>`;
}
$('btnPlay').addEventListener('click', () => {
  playing = !playing;
  syncPlayIcon();
});
$('btnPrev').addEventListener('click', () => {
  if (t > 3) { t = 0; return; }
  idx = (idx - 1 + TRACKS.length) % TRACKS.length;
  t = 0;
  render();
});
$('btnNext').addEventListener('click', () => {
  idx = (idx + 1) % TRACKS.length;
  t = 0;
  render();
});
$('btnNext-track').addEventListener('click', () => {
  idx = (idx + 1) % TRACKS.length;
  t = 0;
  render();
  toast('换了一首示例', TRACKS[idx].title);
});
$('btnClose').addEventListener('click', () => toast('收起播放页', '真实 App 里会滑回列表'));

/* ---------- 进度拖动 ---------- */
const seek = $('seek'), bar = $('bar');
function seekTo(e) {
  const r = bar.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const p = Math.max(0, Math.min(1, x / r.width));
  t = p * TRACKS[idx].dur;
  tick();
}
bar.addEventListener('pointerdown', (e) => {
  seek.classList.add('dragging');
  seekTo(e);
  bar.setPointerCapture(e.pointerId);
});
bar.addEventListener('pointermove', (e) => {
  if (seek.classList.contains('dragging')) seekTo(e);
});
bar.addEventListener('pointerup', (e) => {
  seek.classList.remove('dragging');
  seekTo(e);
});

/* ---------- 喜欢 ---------- */
$('btnLike').addEventListener('click', () => {
  const on = $('btnLike').classList.toggle('on');
  $('btnLike').innerHTML = `<svg><use href="#i-${on ? 'heart' : 'heart-o'}"/></svg>`;
  toast(on ? '已加入我喜欢' : '已取消喜欢', TRACKS[idx].title);
});

/* ---------- 底部三个按钮 ---------- */
$('btnComment').addEventListener('click', () => {
  toast('评论', '会打开这首歌的评论区（预览稿未接）');
});
$('btnDetail').addEventListener('click', () => {
  toast('歌曲详情', TRACKS[idx].album + ' · ' + fmt(TRACKS[idx].dur) + ' · 320kbps');
});
$('btnDownload').addEventListener('click', () => {
  toast('下载', '会保存到本机，VIP 曲目按账号权限处理');
});

/* ---------- toast ---------- */
function toast(title, desc) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ic"><svg><use href="#i-info"/></svg></div>
    <div class="ti"><b>${escapeHtml(title)}</b>${desc ? `<p>${escapeHtml(desc)}</p>` : ''}</div>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2200);
}

/* ---------- 封面尺寸：始终正方形（取容器宽高较小值） ---------- */
function sizeCover() {
  const wrap = document.querySelector('.cover-wrap');
  const cover = document.getElementById('cover');
  const r = wrap.getBoundingClientRect();
  const pad = 0;
  const size = Math.max(120, Math.floor(Math.min(r.width, r.height) - pad));
  cover.style.width = size + 'px';
  cover.style.height = size + 'px';
}
window.addEventListener('resize', sizeCover);
window.addEventListener('orientationchange', () => setTimeout(sizeCover, 120));

/* ---------- 起播 ---------- */
applyMode();
render();
syncPlayIcon();
sizeCover();
</script>
</body>
</html>
