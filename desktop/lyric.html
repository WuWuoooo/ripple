<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ripple 歌词</title>
<!--
  ============================================================
  Ripple · 桌面端独立歌词窗
  ============================================================

  这是「状态栏歌词」在桌面端的对等物。Android 那边是盖在系统状态栏上的
  悬浮窗（LyricOverlay.java），桌面端没有状态栏，所以用一个独立的
  无边框置顶小窗口来承担同一职责。

  为什么单独一个页面、不引用 app/ 下的任何 CSS/JS：
    app/ 那套样式是给「手机播放页」写的，依赖主题变量、安全区、
    玻璃拟态这一整套上下文。歌词窗只有一条透明背景上的文字，
    引进来 3000 行样式反而要为了「别被父级样式影响」写一堆覆盖。
    这里自包含，只有几十行，改起来也不会牵动主界面。

  卡拉OK染色的原理与 app/css/base.css 里那套完全一致：
    background-clip:text + 一条硬边渐变，硬边位置由 --p 控制。
    桌面端不需要为「性能」做取舍（窗口就一行字），所以这里
    连「只有当前行才染色」那类优化都不需要 —— 本来就只有一行。

  与 Rust 的通信：
    · 收：event 'lyric-state'，payload 是**整份状态**（见 push_lyric_state）
    · 发：invoke('lyric_save_pos', {x, y}) 拖动结束后回报位置
    · 首帧：页面加载完主动 invoke('lyric_overlay_sync') 拉一次 ——
      窗口创建和页面加载是异步的，Rust 推首帧时 webview 可能还没起来，
      事件会被丢掉，靠页面自己来要最稳。
  ============================================================
-->
<style>
  /*
   * 全部元素透明：窗口本身是 transparent 的，页面再铺底色就白做了。
   * 用 html,body 双选择器是因为某些环境里 body 的默认背景会盖住 html。
   */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    width:100%;height:100%;}
  /*
   * 降级形态（1.3.9）：Windows 精简版上透明合成可能建不出来，
   * Rust 会退回不透明窗口。那时窗口有底色，页面再"透明"就是白底白字 ——
   * 所以由 Rust 通过 opaque 字段通知，这里补一层深色底。
   * 与 Rust 侧 background_color(11,11,18) 保持一致，避免闪一下变白。
   */
  html.opaque,html.opaque body{background:#0b0b12;}
  body{
    display:flex;align-items:center;justify-content:center;
    /*
     * 字体跟主程序保持同一族。桌面端拿不到 app/ 的 --font，
     * 这里列一份等价的候选：中文优先系统黑体，英文优先无衬线。
     */
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",
      system-ui,-apple-system,"Segoe UI",sans-serif;
    /*
     * 拖动区（L-11，审查 1.3.8）。
     *
     * 以前的写法是给 #wrap 加 data-tauri-drag-region="deep" —— 那等于把
     * **整行歌词**都变成拖动区。而 tauri 的 drag.js 对拖动区按下时会
     * preventDefault()，于是文字永远选不中、复制不了。
     *
     * 现在把拖动区挪到 body（窗口的空白区域），并给 #t 显式写
     * data-tauri-drag-region="false"：drag.js 的 isDragRegion() 从
     * composedPath[0] 往上走，碰到 "false" 立刻返回 false —— 所以
     * 点在**文字上**不拖动（可以正常选中复制），点在文字以外的空白处拖动窗口。
     * 歌词窗是 360x64 而文字只有一行，上下有大片空白，拖动并不难按。
     *
     * 属性不是写死在 HTML 里，而是由 applyDragRegion() 按 locked 状态挂/摘：
     * 锁定时窗口整块鼠标穿透（Rust side set_ignore_cursor_events），
     * 此时页面再留一个拖动区毫无意义，还会让 st.locked 变成一个死状态。
     */
    -webkit-user-select:none;user-select:none;
    cursor:default;
  }
  /* 文字本身可选中复制（未锁定时）；锁定时整窗穿透，选不中也无需选 */
  #t{-webkit-user-select:text;user-select:text;cursor:text;}
  html.locked #t{-webkit-user-select:none;user-select:none;cursor:default;}
  #wrap{
    /* 内边距让文字不贴窗口边缘，视觉上更像一条「药丸」 */
    padding:4px 10px;max-width:100%;box-sizing:border-box;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    /*
     * 左右淡出：长歌词在窄窗口里被裁切时，硬切边很难看。
     * 用 mask 做一个 8px 的渐隐，比 text-overflow 的省略号更干净
     * （省略号在透明背景上像个突兀的点）。
     */
    -webkit-mask:linear-gradient(90deg,transparent 0,#000 8px,
      #000 calc(100% - 8px),transparent 100%);
    mask:linear-gradient(90deg,transparent 0,#000 8px,
      #000 calc(100% - 8px),transparent 100%);
  }
  #t{
    font-size:15px;           /* 由 JS 按 size 覆盖 */
    font-weight:600;
    line-height:1.35;
    /*
     * 兜底颜色。真正的颜色由 JS 从 payload 写进 style。
     * 默认白色是因为「浮层盖在任意桌面背景上」这个场景里，
     * 白字 + 深色描边的可读性最稳。
     */
    color:#fff;
    /*
     * 文字描边（阴影）兜底：桌面背景可能是纯白文档、也可能是深色壁纸，
     * 光靠字色无法保证可读。用一圈黑色模糊阴影在任何背景上都能看清。
     * 由 JS 按 shadow 开关控制强度。
     */
    text-shadow:0 0 6px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.75);
  }
  /*
   * 卡拉OK：已播放部分是 --fill，未播放部分是 --base。
   *
   * ⚠️ 必须同时写 -webkit-text-fill-color 和 color 为 transparent，
   * 否则渐变透不出来（文字仍是实心色，盖在渐变上面）。
   * 这也意味着关掉染色时必须把这两个都还原 —— 见下面的 .plain 类。
   */
  #t.kf{
    background-image:linear-gradient(90deg,
      var(--fill,#b3a2ff) calc(var(--p,0) * 100%),
      var(--base,#fff) 0);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  /* 没有正在播放的歌词时显示这一行，弱化处理 */
  #t.idle{
    color:rgba(255,255,255,.62);
    font-weight:500;
  }
</style>
</head>
<body>
<!--
  L-11：拖动区在 <html>（由 applyDragRegion 按锁定状态挂/摘），
  而文字 #t 显式写 drag-region="false" —— drag.js 从 composedPath[0]
  向上遍历时先命中它并立即返回 false，于是点在文字上不拖动、可以正常
  选中复制；点在文字以外的空白处才拖窗口。
-->
<div id="wrap"><span id="t" class="idle" data-tauri-drag-region="false">Ripple</span></div>

<script>
(function () {
  'use strict';
  var TAURI = window.__TAURI__;
  /* 没有 Tauri 全局对象时（直接用浏览器打开这个文件）不做任何事，
     静态展示「Ripple」即可 —— 不伪造桥，避免出现「看起来能用其实没用」。 */
  if (!TAURI || !TAURI.core || typeof TAURI.core.invoke !== 'function') return;

  var invoke = TAURI.core.invoke;
  var el = document.getElementById('t');

  /*
   * 1.3.9：切换「降级不透明」形态。
   *
   * Rust 侧建透明窗失败时会退回不透明窗，并在状态里把 opaque 置 true。
   * 不透明窗有底色，页面若不铺底就是白底 + 白字，等于看不见 ——
   * 所以这里按状态给 <html> 加/去 opaque 类（样式见文件开头的 CSS）。
   *
   * 做成幂等且可逆：两种形态切换时不残留（虽然目前同一会话只会是一种，
   * 但留成可逆的写法以后换形态不用再改这里）。
   */
  function applyOpaque(on) {
    if (document.documentElement) {
      document.documentElement.classList.toggle('opaque', !!on);
    }
  }

  /*
   * L-11（审查报告，1.3.8）：拖动区跟锁定状态联动。
   *
   * 两件事一起做，因为它们本来就是同一个状态的两个消费者：
   *   ① 未锁定 → 挂拖动区（<html> 承接，文字自己排除，见 CSS 注释）；
   *      锁定   → 摘掉拖动区。锁定的语义是「点击穿透、别动它」，
   *      留着拖动区自相矛盾。
   *   ② 锁定态给 <html> 加 locked 类，让 CSS 把文字改回不可选中 ——
   *      虽然锁定后整窗鼠标穿透本来也点不到，但那是 **Rust 窗口级**的
   *      设置，页面不该假设它一定生效（比如将来有人只改了 flags 没调
   *      set_ignore_cursor_events）。让 DOM 自己也表达一遍这个状态，
   *      两个层面各自成立，比互相依赖更稳。
   *
   * 为什么这修掉了「st.locked 是死状态」：以前 st.locked 只在收事件时
   * 被赋值，全文件再无第二处读它 —— 现在它驱动了 DOM 的这一处真实行为。
   */
  function applyDragRegion(locked) {
    var root = document.documentElement;
    if (!root) return;
    /* ① 拖动区只在未锁定时存在 */
    if (locked) {
      root.removeAttribute('data-tauri-drag-region');
    } else {
      /* "deep" 让点在 <html>/<body> 的任意空白处都能拖，
         而 #t 上的 "false" 会先于它被 drag.js 命中、从而阻断拖动。 */
      root.setAttribute('data-tauri-drag-region', 'deep');
    }
    /* ② 文字可选性 */
    root.classList.toggle('locked', !!locked);
  }

  /* 当前状态。初值与 Rust 侧 LyricState::default() 对齐。 */
  var st = {
    locked: false,
    text: '',
    progress: 0,
    color: '#FFFFFF',
    size: 15,
    alpha: 0.95,
    bold: true,
    shadow: true,
    fill: true,
    fillHex: '#b3a2ff',
    /*
     * ===== 原生侧时间外推的基准（D-02，1.3.4）=====
     *
     * 问题：桌面桥以前只有 setLyricProgress（逐帧推真值），
     * 而歌词窗最主要的用法就是「切到别的程序时看」—— 那时主窗口
     * rAF 暂停、ticker 被 clearInterval，逐帧推送断流，
     * 于是退化成「一下填满、换句才动」，正是 1.3.3 在 Android 上
     * 花十一轮才修掉的那个症状。
     *
     * 修法与 Android 一致：网页只推「基准点」，本窗口自己按
     * performance.now() 外推。区别是这里不需要 Rust 定时器 ——
     * 这个 webview 窗口自己就是可见的（主窗口最小化不影响它），
     * 它的 requestAnimationFrame 照常运行。
     *
     * baseP/baseAt/lineDur/rate/playing 都是 Rust 通过
     * lyric-state 事件带下来的。
     */
    baseP: 0,
    baseAt: 0,
    lineDur: 0,
    rate: 1,
    playing: false
  };

  /** 外推出来的实时进度（0..1），渲染时用这个而不是 st.progress */
  function liveProgress() {
    var base = Number(st.baseP);
    var dur = Number(st.lineDur);
    var rate = Number(st.rate);
    var playing = !!st.playing;
    if (!isFinite(base)) base = 0;
    if (!isFinite(dur) || dur <= 0.01) return Math.max(0, Math.min(1, Number(st.progress) || 0));
    if (!isFinite(rate) || rate <= 0) rate = 1;
    if (!playing) return Math.max(0, Math.min(1, base));
    var elapsed = (performance.now() - Number(st.baseAt)) / 1000;
    if (!isFinite(elapsed) || elapsed < 0) elapsed = 0;
    return Math.max(0, Math.min(1, base + (elapsed * rate) / dur));
  }

  /*
   * 外推帧循环。
   *
   * 只在「有歌词 + 填充开启 + 正在播放 + 句长已知」时才跑，
   * 其余情况立刻停，不空转。30fps 对一行文字的 CSS 变量更新足够。
   */
  var tickOn = false;
  function tick() {
    if (!tickOn) return;
    var need = !!st.text && st.fill && st.playing
      && Number(st.lineDur) > 0.01;
    if (!need) { tickOn = false; return; }
    paintFill(liveProgress());
    requestAnimationFrame(tick);
  }
  function syncTick() {
    var need = !!st.text && st.fill && st.playing && Number(st.lineDur) > 0.01;
    if (need && !tickOn) { tickOn = true; requestAnimationFrame(tick); }
    if (!need) tickOn = false;
  }

  /** 只更新 --p，不重排文字（性能关键路径） */
  function paintFill(p) {
    if (!isFinite(p)) p = 0;
    p = Math.max(0, Math.min(1, p));
    el.style.setProperty('--p', String(Math.round(p * 1000) / 1000));
  }

  /**
   * 按当前状态重画。
   *
   * 每次收到事件都整份重画，不做「哪个字段变了」的差量判断 ——
   * 状态总共十来个字段，重画一次的成本比维护差量逻辑低得多，
   * 而且不会出现「某个字段忘了同步」这一类 bug。
   */
  function render() {
    var text = st.text || '';
    if (text) {
      el.classList.remove('idle');
      el.textContent = text;
    } else {
      /* 没有歌词时显示占位而不是空窗口 —— 空窗口在桌面上看起来像
         「有个东西坏了」，显示 Ripple 至少能说明它是活着的。 */
      el.classList.add('idle');
      el.textContent = 'Ripple';
      el.classList.remove('kf');
    }

    /* 尺寸与颜色 */
    var size = Number(st.size);
    el.style.fontSize = (isFinite(size) && size > 0 ? size : 15) + 'px';
    el.style.fontWeight = st.bold ? '600' : '400';
    el.style.opacity = String(Number(st.alpha) || 1);
    el.style.textShadow = st.shadow
      ? '0 0 6px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.75)'
      : 'none';

    /*
     * 染色开关。
     *
     * 关掉时必须把 .kf 一起摘掉 —— 那个类会把文字填充色设成 transparent，
     * 只改变量不摘类的话，文字会「透明但也没有渐变」，看起来整行消失。
     */
    var canFill = st.fill && !!text;
    if (canFill) {
      el.style.setProperty('--base', st.color || '#FFFFFF');
      el.style.setProperty('--fill', st.fillHex || '#b3a2ff');
      /* 用外推值而不是 st.progress —— 后台时后者会停在最后一次推送 */
      paintFill(liveProgress());
      el.classList.add('kf');
    } else {
      el.classList.remove('kf');
      el.style.color = st.color || '#FFFFFF';
    }
    /* 换句 / 播放状态变化 / 填充开关变化时，重新决定要不要开外推循环 */
    syncTick();
  }

  /* ---------- 收 Rust 推来的状态 ---------- */
  if (TAURI.event && typeof TAURI.event.listen === 'function') {
    TAURI.event.listen('lyric-state', function (e) {
      var d = e && e.payload;
      if (!d || typeof d !== 'object') return;
      /*
       * 逐字段判断存在性再合并，而不是 Object.assign(st, d)。
       * 理由：Rust 那边将来可能只推变化的部分（现在是全量），
       * 用 assign 会把缺失字段盖成 undefined，尺寸/颜色直接回默认值 ——
       * 表现为「歌词偶尔闪一下变成 15px 白字」。
       */
      if (typeof d.locked === 'boolean') { st.locked = d.locked; applyDragRegion(st.locked); }
      if (typeof d.text === 'string') st.text = d.text;
      if (typeof d.progress === 'number') st.progress = d.progress;
      if (typeof d.color === 'string' && d.color) st.color = d.color;
      if (typeof d.size === 'number') st.size = d.size;
      if (typeof d.alpha === 'number') st.alpha = d.alpha;
      if (typeof d.bold === 'boolean') st.bold = d.bold;
      if (typeof d.shadow === 'boolean') st.shadow = d.shadow;
      if (typeof d.fill === 'boolean') st.fill = d.fill;
      if (typeof d.fillHex === 'string' && d.fillHex) st.fillHex = d.fillHex;
      /*
       * 基准字段（D-02）。收到新基准点时必须同时更新 baseAt ——
       * 那是「这一刻的进度是多少」的时间锚点，用本地 performance.now()，
       * 不能用 Rust 侧的时钟（跨进程比较时钟会错位）。
       */
      if (typeof d.baseProgress === 'number') { st.baseP = d.baseProgress; st.baseAt = performance.now(); }
      if (typeof d.lineDur === 'number') st.lineDur = d.lineDur;
      if (typeof d.rate === 'number') st.rate = d.rate;
      if (typeof d.playing === 'boolean') st.playing = d.playing;
      /* 降级形态标记（见 applyOpaque）。每次全量推都带上，所以不必单独记 */
      if (typeof d.opaque === 'boolean') applyOpaque(d.opaque);
      render();
    }).catch(function () { /* 事件系统不可用时静默降级 */ });
  }

  /* ---------- 首帧：主动拉一次状态 ---------- */
  /*
   * 见文件头注释：Rust 推首帧时 webview 可能还没跑起来，事件会被丢掉。
   * 这里在加载完成后自己 invoke 一次，保证第一帧就有内容。
   */
  invoke('lyric_overlay_sync').then(function (d) {
    if (!d || typeof d !== 'object') return;
    Object.keys(st).forEach(function (k) {
      if (d[k] !== undefined && d[k] !== null) st[k] = d[k];
    });
    if (typeof d.baseProgress === 'number') { st.baseP = d.baseProgress; st.baseAt = performance.now(); }
    /*
     * 首帧也要应用：页面加载完自己 invoke 的这次，是降级窗唯一
     * 「确定的」一次拿到 opaque 的机会（Rust 推送可能比页面起来更早被丢掉）。
     */
    if (typeof d.opaque === 'boolean') applyOpaque(d.opaque);
    /* 首帧也要应用拖动区状态：Rust 可能比页面起来更早推过事件（被丢掉），
       只靠事件会让「锁定状态下重开歌词窗」暂时留着拖动区。 */
    applyDragRegion(st.locked);
    render();
  }).catch(function () { applyDragRegion(st.locked); render(); });

  /* ---------- 拖动结束后回报位置 ---------- */
  /*
   * 用 window 的 move 事件而不是 tauri 的 onMoved：
   * onMoved 是窗口自己发的事件，而这里要的是「拖动结束」这个时机。
   * 实际做法是：拖动过程中节流记录位置，松手 300ms 后落盘一次。
   * 这样既不会每移动一像素就写一次磁盘，也不会丢掉最后的位置。
   */
  var posTimer = null;
  function reportPos() {
    var w = TAURI.window;
    if (!w || typeof w.getCurrentWindow !== 'function') return;
    var win = w.getCurrentWindow();
    if (typeof win.outerPosition !== 'function') return;
    win.outerPosition().then(function (p) {
      if (!p) return;
      /* 坐标必须有限，否则会把窗口位置写坏到下次启动看不见 */
      var x = Number(p.x), y = Number(p.y);
      if (!isFinite(x) || !isFinite(y)) return;
      invoke('lyric_save_pos', { x: Math.round(x), y: Math.round(y) })
        .catch(function () {});
    }).catch(function () {});
  }

  /*
   * 监听窗口移动：Tauri 2 里窗口拖动会触发 tauri://move 事件。
   * 不用 mousemove —— 拖动期间鼠标事件是窗口管理器消费的，
   * 页面这边收不到可靠的 mouseup。
   * 节流：300ms 内只落盘一次，拖动停下来之后才真正写。
   */
  if (TAURI.event && typeof TAURI.event.listen === 'function') {
    TAURI.event.listen('tauri://move', function () {
      if (posTimer) clearTimeout(posTimer);
      posTimer = setTimeout(reportPos, 300);
    }).catch(function () {});
  }

  /* 初次渲染前把拖动区定到默认（未锁定）状态，避免首帧短暂不可拖 */
  applyDragRegion(st.locked);
  render();
})();
